<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image Pipeline</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Serverless Image Pipeline</h1>
    <p>Upload a JPEG, PNG or WebP (max 10 MB). It is validated, resized, watermarked, tagged by Rekognition and captioned by Bedrock.</p>
  </header>

  <main>
    <section class="upload">
      <form id="upload-form">
        <input type="file" id="file" accept="image/jpeg,image/png,image/webp" required>
        <button type="submit" id="upload-btn">Upload</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
    </section>

    <section>
      <div class="gallery-head">
        <h2>Gallery</h2>
        <button type="button" id="refresh">Refresh</button>
      </div>
      <div id="gallery" class="gallery"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
